<section class="exams-module">
  <div class="module-header">
    <div class="exam-nav-bar-top" id="exam-breadcrumb-bar">
      <button type="button" class="btn btn-ghost btn-sm exam-back-btn panel-hidden" id="exam-back-btn" aria-label="Geri">
        ← Geri
      </button>
      <div class="exam-breadcrumb" id="exam-breadcrumb"></div>
    </div>
    <h2>Çıkmış Sınav Soruları</h2>
    <p>
      ÖSYM ve MEB arşivinden <strong>AYT</strong>, <strong>AÖL</strong>, YGS, LYS ve ÖSS kitapçıkları —
      kitapçık PDF’si ile bire bir interaktif çözüm
    </p>
    <p class="meta">Sorular ilgili kurumlara aittir; yalnızca eğitim amaçlı sunulmaktadır.</p>
  </div>

  <div class="card-grid page-stats-panel" id="page-stats-exams" aria-label="İstatistikler"></div>

  <!-- 1. Sınav türü seçimi -->
  <div id="exam-groups-view">
    <div class="toolbar exam-catalog-toolbar">
      <input type="search" class="input" id="exam-group-search" placeholder="Sınav türü ara (AYT, AÖL, LYS…)" aria-label="Sınav türü ara" />
      <span class="exam-count meta" id="exam-group-count"></span>
    </div>
    <div class="exam-group-grid card-grid" id="exam-group-grid" role="list"></div>
  </div>

  <!-- 2. Kitapçık listesi -->
  <div id="exam-list-view" class="panel-hidden">
    <div class="toolbar exam-catalog-toolbar">
      <input type="search" class="input" id="exam-search" placeholder="Yıl veya ders ara…" aria-label="Kitapçık ara" />
      <select class="select" id="exam-year-filter" aria-label="Yıl">
        <option value="">Tüm yıllar</option>
      </select>
      <span class="exam-count meta" id="exam-count"></span>
    </div>

    <div class="exam-catalog-wrap card" id="exam-catalog-wrap">
      <div class="exam-catalog-head" role="row">
        <span class="col-year">Yıl</span>
        <span class="col-name">Kitapçık</span>
        <span class="col-session">Oturum / Ders</span>
        <span class="col-org">Soru</span>
      </div>
      <div class="exam-catalog-list" id="exam-catalog-list" role="list"></div>
    </div>
  </div>

  <!-- 3. İnteraktif çözüm (LYS-1 Matematik formatı) -->
  <div class="exam-practice panel-hidden" id="exam-practice">
    <div class="exam-selected card" id="exam-selected-info"></div>

    <div class="exam-timer-bar card" id="exam-timer-bar" hidden aria-live="polite">
      Süre: <strong id="exam-timer-display">00:00</strong>
    </div>

    <div class="exam-session-stats card" id="exam-session-stats" aria-live="polite"></div>

    <div class="exam-progress-wrap" id="exam-progress-wrap" hidden>
      <div class="exam-progress-track">
        <div class="exam-progress-fill" id="exam-progress-fill"></div>
      </div>
      <span class="exam-progress-label" id="exam-progress-label"></span>
    </div>

    <div class="exam-question-palette card" id="exam-question-palette" hidden></div>

    <div class="toolbar exam-practice-toolbar">
      <label class="toggle-label">
        <input type="checkbox" id="exam-show-solution" /> Çözüm metnini göster
      </label>
      <label class="toggle-label">
        <input type="checkbox" id="exam-timer" checked /> Süre sayacı
      </label>
      <button type="button" class="btn btn-ghost btn-sm" id="exam-reset-session">Oturumu sıfırla</button>
      <button type="button" class="btn btn-ghost btn-sm" id="exam-close-practice">Kitapçık listesine dön</button>
    </div>

    <div id="exam-question-area" class="exam-question card"></div>
    <div class="toolbar exam-nav-bar" id="exam-nav"></div>
  </div>
</section>
