<section class="auth-flow-module">
  <div class="card card-3d auth-flow-card">
    <img src="assets/brand/rota-ai-logo.png" alt="" class="logo-robot auth-flow-logo" width="96" height="96" />
    <h2>Şifre yenile</h2>
    <p class="meta" id="reset-hint">Yeni şifreni belirle.</p>
    <form id="reset-form" class="auth-flow-form">
      <label class="label" for="reset-password">Yeni şifre</label>
      <input class="input" id="reset-password" type="password" minlength="6" required />

      <label class="label" for="reset-password2">Şifre tekrarı</label>
      <input class="input" id="reset-password2" type="password" minlength="6" required />

      <button type="submit" class="btn btn-primary">Kaydet</button>
      <p class="auth-flow-msg" id="reset-msg"></p>
    </form>
  </div>
</section>
