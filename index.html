<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ROTA AI — Yolunu bul, hedefe yapay zeka ile var. Ücretsiz 3D dijital eğitim platformu." />
  <meta name="theme-color" content="#0B1026" />
  <meta property="og:image" content="assets/brand/rota-ai-logo.png" />
  <title>ROTA AI — Dijital Eğitim</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css?v=20260619a" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
</head>
<body>
  <div class="scene-3d-bg" aria-hidden="true">
    <div class="scene-grid"></div>
    <div class="scene-orb scene-orb-1"></div>
    <div class="scene-orb scene-orb-2"></div>
    <div class="scene-orb scene-orb-3"></div>
  </div>

  <a href="#main-content" class="skip-link">İçeriğe atla</a>

  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Ana menü">
      <a href="#/" class="sidebar-brand" aria-label="ROTA AI ana sayfa">
        <div class="brand-lockup">
          <img src="assets/brand/rota-ai-logo.png" alt="ROTA AI robot" class="brand-mascot" width="72" height="72" />
          <div class="brand-wordmark-3d">
            <span class="word-rota">ROTA</span>
            <span class="word-ai">AI</span>
          </div>
        </div>
      </a>

      <nav class="sidebar-nav" aria-label="Sayfa gezintisi">
        <a href="#/" class="nav-link active" data-route="/" data-i18n="nav.dashboard">
          <i data-lucide="layout-dashboard"></i><span>Pano</span>
        </a>
        <a href="#/dersler" class="nav-link" data-route="/dersler" data-i18n="nav.lessons">
          <i data-lucide="book-open"></i><span>Dersler</span>
        </a>
        <a href="#/kutuphane" class="nav-link" data-route="/kutuphane" data-i18n="nav.library">
          <i data-lucide="library"></i><span>Kütüphane</span>
        </a>
        <a href="#/sinavlar" class="nav-link" data-route="/sinavlar" data-i18n="nav.exams">
          <i data-lucide="clipboard-list"></i><span>Sınavlar</span>
        </a>
        <a href="#/ai-sohbet" class="nav-link nav-link-ai" data-route="/ai-sohbet" data-i18n="nav.chat">
          <img src="assets/brand/rota-ai-logo.png" alt="" class="nav-brand-icon" width="28" height="28" /><span>AI Sohbet</span>
        </a>
        <a href="#/soru-coz" class="nav-link" data-route="/soru-coz" data-i18n="nav.solver">
          <i data-lucide="pen-line"></i><span>Soru Çöz</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="ai-status" id="global-ai-status" title="AI durumu">
          <img src="assets/brand/rota-ai-logo.png" alt="" class="ai-status-logo" width="28" height="28" />
          <span id="ai-status-label">Hazırlanıyor</span>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="theme-toggle" aria-label="Tema değiştir">
          <i data-lucide="moon"></i>
        </button>
        <button type="button" class="btn btn-ghost btn-sm" id="lang-toggle" aria-label="Dil değiştir">TR</button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <button type="button" class="btn btn-ghost mobile-menu" id="menu-toggle" aria-label="Menüyü aç">
          <i data-lucide="menu"></i>
        </button>
        <h1 class="page-title" id="page-title">Pano</h1>
        <div class="topbar-spacer" aria-hidden="true"></div>

        <div class="topbar-auth-cluster">
          <div class="topbar-auth-slot">
            <button type="button" class="topbar-auth-trigger topbar-auth-trigger-member" id="topbar-member-trigger" aria-expanded="false" aria-controls="topbar-member-dropdown">
              <i data-lucide="user"></i>
              <span id="topbar-member-trigger-label">Site üyeliği</span>
            </button>
            <div class="topbar-auth-dropdown auth-dropdown-member" id="topbar-member-dropdown" hidden>
              <div class="auth-dropdown-panel sidebar-member-panel" id="sidebar-auth-panel">
                <p class="sidebar-auth-title">Site üyeliği</p>
                <p class="meta sidebar-auth-hint">Dersler, sınavlar ve AI için bir kez demo; devamı için üye girişi.</p>

                <div id="sidebar-auth-guest" class="sidebar-auth-guest">
                  <form id="sidebar-login-form" class="sidebar-auth-form">
                    <label class="label" for="sidebar-login-email">E-posta</label>
                    <input class="input" id="sidebar-login-email" type="email" autocomplete="email" required />

                    <label class="label" for="sidebar-login-password">Şifre</label>
                    <input class="input" id="sidebar-login-password" type="password" autocomplete="current-password" required />

                    <button type="submit" class="btn btn-primary btn-sm btn-block">Üyelik girişi</button>
                    <button type="button" class="btn btn-ghost btn-sm btn-block" id="sidebar-forgot-btn">Şifremi unuttum</button>
                    <p class="auth-msg" id="sidebar-login-msg"></p>
                  </form>
                  <button type="button" class="btn btn-secondary btn-sm btn-block sidebar-register-btn" id="sidebar-register-btn">Üye ol</button>
                </div>

                <div id="sidebar-auth-logged" class="sidebar-auth-logged" hidden>
                  <img src="" alt="" id="sidebar-user-avatar" class="sidebar-user-avatar" width="40" height="40" hidden />
                  <div class="sidebar-user-meta">
                    <strong id="sidebar-user-name"></strong>
                    <span id="sidebar-user-email"></span>
                  </div>
                  <button type="button" class="btn btn-secondary btn-sm btn-block" id="sidebar-panel-link">Profilim</button>
                  <button type="button" class="btn btn-ghost btn-sm btn-block" id="sidebar-logout-btn">Üyelikten çık</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </header>
      <main id="main-content" class="main-content" tabindex="-1"></main>
    </div>

    <aside id="site-widget-clock" class="site-widget-clock" aria-label="Takvim ve saat"></aside>

    <nav class="tabbar" aria-label="Mobil menü">
      <a href="#/" class="tab-link" data-route="/"><i data-lucide="layout-dashboard"></i><span>Pano</span></a>
      <a href="#/kutuphane" class="tab-link" data-route="/kutuphane"><i data-lucide="library"></i><span>Kütüphane</span></a>
      <a href="#/sinavlar" class="tab-link" data-route="/sinavlar"><i data-lucide="clipboard-list"></i><span>Sınav</span></a>
      <a href="#/ai-sohbet" class="tab-link tab-link-ai" data-route="/ai-sohbet"><img src="assets/brand/rota-ai-logo.png" alt="" class="tab-brand-icon" width="22" height="22" /><span>AI</span></a>
      <a href="#/soru-coz" class="tab-link" data-route="/soru-coz"><i data-lucide="pen-line"></i><span>Soru</span></a>
    </nav>
  </div>

  <div class="modal-overlay" id="modal-register" hidden>
    <div class="modal card card-3d" role="dialog" aria-labelledby="register-title">
      <button type="button" class="modal-close" data-close-modal="modal-register" aria-label="Kapat">&times;</button>
      <h3 id="register-title">Üyelik kaydı</h3>
      <form id="register-form" class="auth-modal-form">
        <label class="label" for="register-name">Ad Soyad</label>
        <input class="input" id="register-name" type="text" autocomplete="name" required />

        <label class="label" for="register-email">E-posta</label>
        <input class="input" id="register-email" type="email" autocomplete="email" required />

        <label class="label" for="register-password">Şifre</label>
        <input class="input" id="register-password" type="password" minlength="6" autocomplete="new-password" required />

        <label class="label" for="register-password2">Şifre tekrarı</label>
        <input class="input" id="register-password2" type="password" minlength="6" autocomplete="new-password" required />

        <button type="submit" class="btn btn-primary btn-block">Kaydı tamamla</button>
        <p class="auth-msg" id="register-msg"></p>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="modal-forgot" hidden>
    <div class="modal card card-3d" role="dialog" aria-labelledby="forgot-title">
      <button type="button" class="modal-close" data-close-modal="modal-forgot" aria-label="Kapat">&times;</button>
      <h3 id="forgot-title">Şifremi unuttum</h3>
      <p class="meta">Kayıtlı e-posta adresini yaz; sıfırlama bağlantısı gönderilir.</p>
      <form id="forgot-form" class="auth-modal-form">
        <label class="label" for="forgot-email">E-posta</label>
        <input class="input" id="forgot-email" type="email" autocomplete="email" required />
        <button type="submit" class="btn btn-primary btn-block">Gönder</button>
        <p class="auth-msg" id="forgot-msg"></p>
      </form>
    </div>
  </div>

  <script type="module" src="app.js?v=20260619a"></script>
</body>
</html>
